# Use this Blueprint path when connecting the staged HRIS repository to Render.
# No credentials, database migrations or seeders run during the image build.
services:
  - type: web
    name: hris-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: .
    dockerfilePath: ./resources/deployment/render/Dockerfile
    autoDeployTrigger: 'off'
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: HRIS
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: 'false'
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: PORT
        value: '10000'
      - key: DB_CONNECTION
        value: mysql
      - key: DB_CHARSET
        value: utf8mb4
      - key: DB_COLLATION
        value: utf8mb4_unicode_ci
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/secrets/hris-db-ca.pem
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_COOKIE
        value: hris_hosted_session
      - key: SESSION_DOMAIN
        value: 'null'
      - key: SESSION_SECURE_COOKIE
        value: 'true'
      - key: SESSION_HTTP_ONLY
        value: 'true'
      - key: SESSION_ENCRYPT
        value: 'true'
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: DB_QUEUE_RETRY_AFTER
        value: '90'
      - key: FILESYSTEM_DISK
        value: local
      - key: RUN_MIGRATIONS
        value: 'false'
      - key: RUN_REVERB
        value: 'true'
      - key: RUN_QUEUE_WORKER
        value: 'true'
      - key: RUN_SCHEDULER
        value: 'true'
      - key: RUN_TELEGRAM_POLLER
        value: 'false'
      - key: TELEGRAM_ENABLED
        value: 'false'
      - key: HRIS_EMAIL_ENABLED
        value: 'false'
      - key: BROADCAST_CONNECTION
        value: reverb
      - key: REVERB_HOST
        value: 127.0.0.1
      - key: REVERB_PORT
        value: '8082'
      - key: REVERB_SCHEME
        value: http
      - key: REVERB_SERVER_HOST
        value: 127.0.0.1
      - key: REVERB_SERVER_PORT
        value: '8082'
      - key: REVERB_APP_ACCEPT_CLIENT_EVENTS_FROM
        value: none
      - key: TRUSTED_PROXIES
        value: ''
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: HRIS_PROXY_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ACK_DEDICATED_DATABASE
        sync: false
      - key: ACK_EPHEMERAL_STORAGE
        sync: false
      - key: REVERB_APP_ID
        sync: false
      - key: REVERB_APP_KEY
        sync: false
      - key: REVERB_APP_SECRET
        sync: false
      - key: REVERB_ALLOWED_ORIGINS
        sync: false
